nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: kubeportal-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi
  env:
    javaToolOptions: -XX:MaxRAMPercentage=75
    kubernetesWatchersEnabled: "true"
    deploymentJobsEnabled: "true"

frontend:
  replicaCount: 1
  image:
    repository: kubeportal-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  auth:
    database: kube_portal
    username: postgres
    # Obligatoire si secrets.existingSecret est vide.
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

externalDatabase:
  host: ""
  port: 5432
  database: kube_portal
  username: postgres

secrets:
  # Secret existant contenant les clés DB_PASSWORD et INITIAL_ADMIN_PASSWORD.
  existingSecret: ""

initialAdmin:
  username: admin
  email: admin@example.local
  # Obligatoire si secrets.existingSecret est vide.
  password: ""

cors:
  allowedOrigins: http://kubeportal.local,http://localhost:8080

sessionCookieSecure: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  # Donne au backend la gestion des ressources applicatives dans tous les namespaces.
  # Désactiver pour limiter les droits au namespace d'installation.
  clusterWide: true

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: kubeportal.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
