spring.application.name=Backend
spring.datasource.url=jdbc:postgresql://localhost:5432/kube_portal
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.bootstrap-admin.username=${INITIAL_ADMIN_USERNAME:}
app.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}

app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.ip-max-attempts=${LOGIN_IP_MAX_ATTEMPTS:20}
app.security.login.attempt-window=${LOGIN_ATTEMPT_WINDOW:15m}
app.security.login.block-duration=${LOGIN_BLOCK_DURATION:15m}
app.security.login.max-tracked-keys=${LOGIN_MAX_TRACKED_KEYS:10000}

app.kubernetes.connection-timeout-ms=${KUBERNETES_CONNECTION_TIMEOUT_MS:5000}
app.kubernetes.request-timeout-ms=${KUBERNETES_REQUEST_TIMEOUT_MS:15000}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:5000}
spring.mvc.async.request-timeout=${ASYNC_REQUEST_TIMEOUT_MS:65000}
app.sse.heartbeat-ms=${SSE_HEARTBEAT_MS:25000}
app.deployment.jobs.max-retries=${DEPLOYMENT_JOB_MAX_RETRIES:3}
app.deployment.jobs.stale-after=${DEPLOYMENT_JOB_STALE_AFTER:5m}
app.deployment.jobs.enabled=${DEPLOYMENT_JOBS_ENABLED:true}
app.kubernetes.watchers.enabled=${KUBERNETES_WATCHERS_ENABLED:true}
