@if (user(); as currentUser) {
  <div class="min-h-screen bg-slate-50">
    <app-sidebar
      [user]="currentUser"
      [loggingOut]="loggingOut()"
      [mobileOpen]="mobileMenuOpen()"
      (logoutRequested)="logout()"
      (mobileCloseRequested)="closeMobileMenu()"
      (collapsedChange)="sidebarCollapsed.set($event)"
    />

    <main class="app-main-shell min-h-screen" [style.--sidebar-width.px]="sidebarCollapsed() ? 80 : 288">
      <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200/80 bg-slate-50/85 px-5 backdrop-blur-xl lg:px-8">
        <button type="button" (click)="toggleMobileMenu()" class="grid size-9 place-items-center rounded-xl border border-slate-200 bg-white text-slate-600 shadow-sm lg:hidden" aria-label="Ouvrir la navigation"><svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h13" stroke-linecap="round" /></svg></button>
        <div><p class="text-sm font-semibold text-slate-900">KubePortal</p><p class="hidden text-xs text-slate-500 sm:block">Plateforme de déploiement</p></div>
        <div class="ml-auto flex items-center gap-2"><span class="hidden text-sm font-medium text-slate-600 sm:block">{{ currentUser.username }}</span><span class="grid size-8 place-items-center rounded-full bg-blue-600 text-xs font-bold text-white">{{ currentUser.username.slice(0, 1).toUpperCase() }}</span></div>
      </header>
      <div class="page-shell"><router-outlet /></div>
    </main>
  </div>
}
