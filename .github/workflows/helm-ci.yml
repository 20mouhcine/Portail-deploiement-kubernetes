name: Helm CI

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
      - '.github/workflows/helm-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'helm/**'
      - '.github/workflows/helm-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: >-
          helm lint ./helm/kubeportal
          --set-string postgresql.auth.password=ci-database-password
          --set-string initialAdmin.password=ci-administrator-password

      - name: Render chart
        run: >-
          helm template kubeportal ./helm/kubeportal
          --namespace kubeportal
          --set-string postgresql.auth.password=ci-database-password
          --set-string initialAdmin.password=ci-administrator-password
