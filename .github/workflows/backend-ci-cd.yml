name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '!.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '!.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn test
        working-directory: Backend

      - name: Build
        run: mvn clean package -DskipTests
        working-directory: Backend

      - name: Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: false
          tags: kubeportal-backend:test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kubeportal-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/kubeportal-backend:latest
